<style>
  :root{
    color-scheme:dark;
    --navy: #16233d;
    --navy-deep: #0e1728;
    --parchment: #f4efe4;
    --parchment-dark: #e8e0cf;
    --gold: #b8912f;
    --gold-light: #d9b968;
    --ink: #1c1c1c;
    --ink-soft: #4a4a4a;
    --right: #2f6b4f;
    --right-bg: #e3ede6;
    --wrong: #a53d30;
    --wrong-bg: #f3e4e0;
    --rose: #a6455a;
    --rose-bg: #f5e6e9;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    font-family:'Inter', sans-serif;
    background: var(--navy-deep);
    color: var(--ink);
    min-height:100vh;
  }
  .app{
    max-width: 920px;
    margin: 0 auto;
    min-height: 100vh;
    background: var(--parchment);
    box-shadow: 0 0 60px rgba(0,0,0,0.4);
    display:flex;
    flex-direction:column;
  }

  header.top{
    background: var(--navy);
    color: var(--parchment);
    padding: 28px 32px 24px;
    border-bottom: 4px solid var(--gold);
    position:relative;
  }
  header.top .kicker{
    font-family:'IBM Plex Mono', monospace;
    font-size: 12px;
    letter-spacing: 0.04em;
    color: var(--gold-light);
    margin: 0 0 6px;
  }
  header.top h1{
    font-family:'Lora', serif;
    font-weight:600;
    font-size: 30px;
    margin: 0;
    line-height:1.15;
  }
  header.top .sub{
    margin: 8px 0 0;
    font-size: 14.5px;
    color: #cdd6e4;
    max-width: 55ch;
    line-height:1.5;
  }
  .back-link{
    background:none;
    border:none;
    color: var(--gold-light);
    font-family:'Inter',sans-serif;
    font-size: 13.5px;
    cursor:pointer;
    padding: 0;
    margin-bottom: 14px;
    display:inline-flex;
    align-items:center;
    gap:6px;
  }
  .back-link:hover{ color: var(--parchment); }

  main{
    flex:1;
    padding: 36px 32px 48px;
  }

  /* ---------- Loading / error ---------- */
  .center-note{
    text-align:center;
    padding: 60px 20px;
    color: var(--ink-soft);
    font-size: 15px;
    line-height:1.6;
  }
  .center-note .retry{
    margin-top: 18px;
  }

  /* ---------- Daily card ---------- */
  .daily-card{
    background: var(--navy);
    color: var(--parchment);
    padding: 24px 26px;
    margin-bottom: 30px;
    border-left: 4px solid var(--gold-light);
    position: relative;
  }
  .daily-card .kicker{
    font-family:'IBM Plex Mono', monospace;
    font-size: 12px;
    color: var(--gold-light);
    margin: 0 0 8px;
  }
  .daily-card h2{
    font-family:'Lora', serif;
    font-size: 22px;
    margin: 0 0 8px;
  }
  .daily-card p.desc{
    font-size: 14px;
    color: #cdd6e4;
    margin: 0 0 18px;
    max-width: 50ch;
    line-height:1.55;
  }
  .daily-card .done-row{
    display:flex;
    align-items:center;
    gap:14px;
    flex-wrap:wrap;
  }
  .daily-card .done-score{
    font-family:'Lora', serif;
    font-size: 26px;
    font-weight:700;
  }
  .daily-card .done-msg{
    background: rgba(217,185,104,0.15);
    border-left: 3px solid var(--gold-light);
    padding: 12px 16px;
    font-size: 14.5px;
    line-height:1.5;
    margin-top: 14px;
  }

  /* ---------- Subject picker (home) ---------- */
  .subject-grid{
    display:grid;
    grid-template-columns: 1fr;
    gap: 0;
    border-top: 1px solid var(--parchment-dark);
  }
  .subject-row{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap: 16px;
    padding: 20px 4px;
    border-bottom: 1px solid var(--parchment-dark);
    background: none;
    border-left:none; border-right:none; border-top:none;
    width:100%;
    text-align:left;
    cursor:pointer;
    font-family:inherit;
    color: inherit;
    transition: padding-left 0.15s ease;
  }
  .subject-row:hover{
    padding-left: 12px;
    background: rgba(184,145,47,0.07);
  }
  .subject-row .num{
    font-family:'IBM Plex Mono', monospace;
    font-size: 13px;
    color: var(--gold);
    width: 34px;
    flex-shrink:0;
  }
  .subject-row .title{
    font-family:'Lora', serif;
    font-size: 19px;
    font-weight:600;
    flex:1;
  }
  .subject-row .meta{
    font-size: 12.5px;
    color: var(--ink-soft);
    font-family:'IBM Plex Mono', monospace;
    flex-shrink:0;
  }
  .subject-row .arrow{
    color: var(--gold);
    font-size: 18px;
    flex-shrink:0;
  }

  .intro-note{
    font-size: 14px;
    color: var(--ink-soft);
    line-height:1.6;
    margin: 0 0 26px;
    max-width: 62ch;
  }

  /* ---------- Quiz screen ---------- */
  .progress-row{
    display:flex;
    align-items:center;
    gap:14px;
    margin-bottom: 26px;
  }
  .progress-track{
    flex:1;
    height:6px;
    background: var(--parchment-dark);
    border-radius: 3px;
    overflow:hidden;
  }
  .progress-fill{
    height:100%;
    background: var(--gold);
    transition: width 0.3s ease;
  }
  .progress-fill.rose{ background: var(--rose); }
  .progress-label{
    font-family:'IBM Plex Mono', monospace;
    font-size: 12.5px;
    color: var(--ink-soft);
    white-space:nowrap;
  }

  .question-card{
    background:#fff;
    border: 1px solid var(--parchment-dark);
    border-left: 4px solid var(--gold);
    padding: 26px 28px;
    margin-bottom: 22px;
  }
  .question-card.daily{ border-left-color: var(--rose); }
  .question-card .art-label{
    font-family:'IBM Plex Mono', monospace;
    font-size: 12px;
    color: var(--gold);
    margin: 0 0 10px;
    display:flex;
    gap: 10px;
    align-items:center;
  }
  .question-card.daily .art-label{ color: var(--rose); }
  .question-card .subject-badge{
    background: var(--parchment-dark);
    padding: 2px 8px;
    font-size: 11px;
    color: var(--ink-soft);
  }
  .question-card .statement{
    font-family:'Lora', serif;
    font-size: 18.5px;
    line-height:1.55;
    margin:0;
    color: var(--ink);
  }

  .options{
    display:flex;
    flex-direction:column;
    gap: 12px;
  }
  .option{
    display:flex;
    gap: 14px;
    align-items:flex-start;
    padding: 16px 18px;
    background:#fff;
    border: 1px solid var(--parchment-dark);
    cursor:pointer;
    text-align:left;
    font-family:'Inter',sans-serif;
    font-size: 15px;
    line-height:1.5;
    color: var(--ink);
    transition: border-color 0.15s ease, background 0.15s ease;
  }
  .option:hover:not(.locked){
    border-color: var(--gold);
    background: #fffdf6;
  }
  .option .letter{
    font-family:'IBM Plex Mono', monospace;
    font-weight:500;
    color: var(--gold);
    flex-shrink:0;
    width: 18px;
  }
  .option.locked{ cursor:default; }
  .option.selected{
    border-color: var(--gold);
    background: #fffdf6;
    box-shadow: inset 3px 0 0 var(--gold);
  }
  .option.selected .letter{ color: var(--gold); }
  .option.correct{
    background: var(--right-bg);
    border-color: var(--right);
  }
  .option.correct .letter{ color: var(--right); }
  .option.incorrect{
    background: var(--wrong-bg);
    border-color: var(--wrong);
  }
  .option.incorrect .letter{ color: var(--wrong); }
  .option.dim{ opacity: 0.55; }

  .explanation{
    margin-top: 10px;
    padding: 16px 18px;
    font-size: 14px;
    line-height:1.6;
    border-left: 3px solid;
  }
  .explanation.right{
    background: var(--right-bg);
    border-color: var(--right);
    color: #1f4635;
  }
  .explanation.wrong{
    background: var(--wrong-bg);
    border-color: var(--wrong);
    color: #6d2a20;
  }
  .explanation .head{
    font-weight:600;
    display:block;
    margin-bottom: 4px;
  }

  .next-row{
    display:flex;
    justify-content:flex-end;
    margin-top: 22px;
  }
  button.primary{
    background: var(--navy);
    color: var(--parchment);
    border:none;
    padding: 13px 26px;
    font-family:'Inter',sans-serif;
    font-weight:600;
    font-size: 14.5px;
    cursor:pointer;
    display:inline-flex;
    align-items:center;
    gap:8px;
  }
  button.primary:hover{ background: var(--navy-deep); }
  button.primary.rose{ background: var(--rose); }
  button.primary.rose:hover{ background: #8a3749; }
  button.ghost{
    background:none;
    border: 1px solid var(--navy);
    color: var(--navy);
    padding: 13px 26px;
    font-family:'Inter',sans-serif;
    font-weight:600;
    font-size: 14.5px;
    cursor:pointer;
  }
  button.ghost:hover{ background: rgba(22,35,61,0.06); }
  button.primary:disabled{ opacity:0.5; cursor:default; }

  /* ---------- Result screen ---------- */
  .result-wrap{
    text-align:center;
    padding: 20px 0 10px;
  }
  .result-score{
    font-family:'Lora', serif;
    font-size: 64px;
    font-weight:700;
    color: var(--navy);
    margin: 10px 0 4px;
    line-height:1;
  }
  .result-score span{
    font-size: 26px;
    color: var(--ink-soft);
    font-weight:500;
  }
  .result-label{
    font-family:'IBM Plex Mono', monospace;
    font-size: 13px;
    color: var(--gold);
    letter-spacing:0.03em;
  }
  .result-msg{
    font-size: 15px;
    color: var(--ink-soft);
    max-width: 46ch;
    margin: 18px auto 30px;
    line-height:1.6;
  }
  .result-actions{
    display:flex;
    gap:14px;
    justify-content:center;
    flex-wrap:wrap;
  }
  .cute-message{
    background: var(--rose-bg);
    border-left: 4px solid var(--rose);
    padding: 22px 24px;
    max-width: 48ch;
    margin: 8px auto 28px;
    font-family:'Lora', serif;
    font-style: italic;
    font-size: 17px;
    color: #6d2436;
    line-height:1.6;
    text-align:left;
  }

  /* Mantém o quiz no mesmo tema escuro da nova Home. */
  :root{
    --navy:#121a28;
    --navy-deep:#090b10;
    --parchment:#10141d;
    --parchment-dark:#252e3d;
    --gold:#d0ad5b;
    --gold-light:#e3c47b;
    --ink:#edf1f7;
    --ink-soft:#a1acbd;
    --right:#69d7a4;
    --right-bg:#14271f;
    --wrong:#e18478;
    --wrong-bg:#301e1d;
    --rose:#c2768a;
    --rose-bg:#2d1d25;
  }
  [data-theme="dark"] header.top{color:#f1f4f9;}
  [data-theme="dark"] header.top h1{color:#f1f4f9;}
  [data-theme="dark"] header.top .kicker{color:#f0d58f;}
  [data-theme="dark"] header.top .sub{color:#d4deea;}
  [data-theme="dark"] .daily-card{color:#f1f4f9;}
  [data-theme="dark"] .daily-card h2{color:#f1f4f9;}
  [data-theme="dark"] .subject-row:disabled{opacity:1;color:#cbd5e2;}
  .app{background:var(--parchment);box-shadow:0 0 70px rgba(0,0,0,.28);}
  header.top{background:#101827;border-bottom-color:var(--gold);}
  .daily-card{background:#121a28;border:1px solid rgba(227,196,123,.16);border-left:4px solid var(--gold-light);border-radius:10px;}
  .subject-grid{border-top-color:var(--parchment-dark);}
  .subject-row{border-bottom-color:var(--parchment-dark);border-radius:7px;}
  .subject-row:hover{background:rgba(208,173,91,.07);}
  .question-card,.option{background:#151b26;border-color:#2a3342;border-radius:9px;}
  .question-card{border-left-color:var(--gold);}
  .question-card .subject-badge{background:#232c3a;color:#c0cad8;border-radius:5px;}
  .option:hover:not(.locked),.option.selected{background:#202330;border-color:var(--gold);}
  .option.correct{background:var(--right-bg);border-color:var(--right);}
  .option.incorrect{background:var(--wrong-bg);border-color:var(--wrong);}
  .explanation.right{color:#c3f0d7;}
  .explanation.wrong{color:#f2c9c2;}
  button.primary{border-radius:8px;background:#263852;color:#f1f4f9;}
  button.primary:hover{background:#314966;}
  button.primary.rose{background:#603543;}
  button.primary.rose:hover{background:#754151;}
  button.ghost{border-color:#3a4658;border-radius:8px;color:#d6deea;}
  button.ghost:hover{background:rgba(255,255,255,.05);}
  .result-score{color:var(--gold-light);}
  .result-score span{color:var(--ink-soft);}
  .cute-message{background:var(--rose-bg);border-radius:9px;color:#f1c6d1;}
  :focus-visible{outline:2px solid #d0ad5b;outline-offset:3px;}

/* ====================== HELPERS ====================== */
function esc(str){
  const d = document.createElement("div");
  d.textContent = String(str ?? "");
  return d.innerHTML;
}

function shuffle(array){
  const arr = array.slice();
  for(let i = arr.length - 1; i > 0; i--){
    const j = Math.floor(Math.random() * (i + 1));
    [arr[i], arr[j]] = [arr[j], arr[i]];
  }
  return arr;
}

function hashStringToInt(str){
  let hash = 0;
  for(let i = 0; i < str.length; i++){
    hash = (hash << 5) - hash + str.charCodeAt(i);
    hash |= 0;
  }
  return hash;
}

function mulberry32(seed){
  let a = seed;
  return function(){
    a |= 0; a = a + 0x6D2B79F5 | 0;
    let t = Math.imul(a ^ a >>> 15, 1 | a);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}

function seededShuffle(array, seedStr){
  const rand = mulberry32(hashStringToInt(seedStr));
  const arr = array.slice();
  for(let i = arr.length - 1; i > 0; i--){
    const j = Math.floor(rand() * (i + 1));
    [arr[i], arr[j]] = [arr[j], arr[i]];
  }
  return arr;
}

function todayStr(){
  const d = new Date();
  const y = d.getFullYear();
  const m = String(d.getMonth() + 1).padStart(2, "0");
  const day = String(d.getDate()).padStart(2, "0");
  return `${y}-${m}-${day}`;
}

function pickRandomQuestions(subjectKey, count){
  const bank = BANK_BY_SUBJECT[subjectKey] || [];
  const n = Math.min(count, bank.length);
  return shuffle(bank).slice(0, n);
}

function getDailyQuestions(){
  const pool = ALL_QUESTIONS.filter(q => q.difficulty === "dificil");
  const shuffled = seededShuffle(pool, todayStr());
  return shuffled.slice(0, 5);
}

async function ensureAnonymousSession(){
  const { data: sessionData, error: sessionError } = await sb.auth.getSession();
  if(sessionError) throw sessionError;

  if(sessionData.session?.user){
    currentUser = sessionData.session.user;
    return currentUser;
  }

  const { data, error } = await sb.auth.signInAnonymously();
  if(error) throw error;
  if(!data.user) throw new Error("Sessão anônima não criada.");

  currentUser = data.user;
  return currentUser;
}

      options: {

      correct: row.correct,
      explanations: {

        B: row.explanation_b,
        C: row.explanation_c,
        D: row.explanation_d
      },
      difficulty: row.difficulty
    }));

    BANK_BY_SUBJECT = {};
    ALL_QUESTIONS.forEach(q => {
      if(!BANK_BY_SUBJECT[q.subject]) BANK_BY_SUBJECT[q.subject] = [];
      BANK_BY_SUBJECT[q.subject].push(q);
    });

    const { data: dailyRow, error: dErr } = await sb
      .from("daily_attempts")
      .select("id,attempt_date,score,completed,message_shown,created_at")
      .eq("attempt_date", todayStr())

      .maybeSingle();

    if(dErr) throw dErr;
    dailyStatusToday = dailyRow || null;

    state.screen = "home";
    render();
  } catch(err){
    console.error("Falha ao carregar o aplicativo:", err);
    lastLoadError = getSafeErrorMessage(err);
    state.screen = "error";
    render();

  const q = state.roundQuestions[state.currentIndex];
  if(!q) return;
  state.confirmedAnswer = true;
  if(state.selectedOption === q.correct) state.score++;
  render();
}

async function nextQuestion(){
  if(!state.confirmedAnswer) return;

  if(state.currentIndex < state.roundQuestions.length - 1){
    state.currentIndex++;
    state.answered = false;
    state.selectedOption = null;
    state.confirmedAnswer = false;
    render();
    return;
  }

  if(state.isDaily){
    let message = null;
    if(state.score === state.roundQuestions.length){
      message = pickCuteMessage();
    }
    state.dailyMessage = message;

    try {
      const payload = {
        user_id: currentUser.id,
        attempt_date: todayStr(),
        score: state.score,
        completed: true,
        message_shown: message
      };

      const { data, error } = await sb
        .from("daily_attempts")
        .upsert(payload, { onConflict: "user_id,attempt_date" })
        .select("id,attempt_date,score,completed,message_shown,created_at")
        .single();

      if(error) throw error;
      dailyStatusToday = data;
    } catch(err){
      console.error("Falha ao registrar o daily:", err);
      lastLoadError = getSafeErrorMessage(err);
      state.screen = "error";
      render();
      return;
    }

    state.screen = "daily-result";
    render();
  } else {
    state.screen = "result";
    render();
  }
}

function goHome(){
  state = {
    screen: "home",
    subjectKey: null,
    roundQuestions: [],
    currentIndex: 0,
    answered: false,
    selectedOption: null,
    confirmedAnswer: false,
    score: 0,
    isDaily: false,
    dailyMessage: null
  };
  render();
}

function retrySameSubject(){
  if(state.subjectKey) startQuiz(state.subjectKey);
}

/* ====================== RENDER ====================== */
function renderHeader(){
  const titleEl = document.getElementById("header-title");
  const inner = document.getElementById("header-inner");

  let backHtml = "";
  if(state.screen !== "home" && state.screen !== "loading" && state.screen !== "error"){
    backHtml = `<button type="button" class="back-link" data-action="home">&larr; voltar às matérias</button>`;
  }

  if(state.screen === "loading"){
    inner.innerHTML = `<p class="kicker">ESTUDOS EM DIREITO</p><h1>Carregando questões…</h1>`;
  } else if(state.screen === "error"){
    inner.innerHTML = `<p class="kicker">ESTUDOS EM DIREITO</p><h1>Não consegui carregar</h1>`;
  } else if(state.screen === "home"){
    inner.innerHTML = `
      <p class="kicker">PREPARAÇÃO PARA OAB · FGV</p>
      <h1>Escolha a matéria</h1>
      <p class="sub">Pratique com questões jurídicas por matéria. Selecione uma alternativa, confirme sua resposta e veja as explicações para aprender com cada rodada.</p>
    `;
  } else if(state.screen === "quiz"){
    inner.innerHTML = `${backHtml}<p class="kicker">${esc(SUBJECT_LABELS[state.subjectKey].toUpperCase())}</p><h1>Simulado em andamento</h1>`;
  } else if(state.screen === "result"){
    inner.innerHTML = `${backHtml}<p class="kicker">${esc(SUBJECT_LABELS[state.subjectKey].toUpperCase())}</p><h1>Resultado do simulado</h1>`;
  } else if(state.screen === "daily-quiz"){
    inner.innerHTML = `${backHtml}<p class="kicker">DESAFIO DIÁRIO — ${esc(todayStr())}</p><h1>5 questões difíceis de hoje</h1>`;
  } else if(state.screen === "daily-result"){
    inner.innerHTML = `${backHtml}<p class="kicker">DESAFIO DIÁRIO — ${esc(todayStr())}</p><h1>Resultado de hoje</h1>`;
  }
}

function renderLoading(){
  document.getElementById("main").innerHTML = `<p class="center-note">Preparando seu desafio…</p>`;
}

function renderError(){
  document.getElementById("main").innerHTML = `
    <p class="center-note">
      ${esc(lastLoadError || "Não foi possível carregar as questões agora. Confira sua conexão e tente novamente.")}
      <br><br>
      <button type="button" class="primary retry" data-action="retry">Tentar novamente</button>
    </p>
  `;
}

function renderDailyCard(){
  const total = 5;
  if(dailyStatusToday?.completed){
    const score = Number.isInteger(dailyStatusToday.score) ? dailyStatusToday.score : 0;
    const perfect = score === total;
    return `
      <div class="daily-card">
        <p class="kicker">DESAFIO DIÁRIO — ${esc(todayStr())}</p>
        <h2>Você já jogou hoje</h2>
        <div class="done-row">
          <span class="done-score">${score}/${total}</span>
          <span style="font-size:13.5px;color:#cdd6e4;">Volte amanhã pra um novo desafio.</span>
        </div>
        ${perfect && dailyStatusToday.message_shown ? `<div class="done-msg">${esc(dailyStatusToday.message_shown)}</div>` : ""}
      </div>
    `;
  }
  return `
    <div class="daily-card">
      <p class="kicker">DESAFIO DIÁRIO — ${esc(todayStr())}</p>
      <h2>5 questões difíceis, sorteadas entre todas as matérias</h2>
      <p class="desc">O mesmo desafio vale para você durante o dia. Acerte as 5 e algo especial aparece no final.</p>
      <button type="button" class="primary rose" data-action="daily">Começar desafio de hoje &rarr;</button>
    </div>
  `;
}

function renderHome(){
  const main = document.getElementById("main");
  const keys = Object.keys(SUBJECT_LABELS).filter(k => BANK_BY_SUBJECT[k] && BANK_BY_SUBJECT[k].length);
  let rows = keys.map((key, i) => {
    const label = SUBJECT_LABELS[key];
    const count = BANK_BY_SUBJECT[key].length;
    const num = String(i + 1).padStart(2, "0");
    return `
      <button type="button" class="subject-row" data-subject="${esc(key)}">
        <span class="num">${num}</span>
        <span class="title">${esc(label)}</span>
        <span class="meta">${count} no banco</span>
        <span class="arrow">&rarr;</span>
      </button>
    `;
  }).join("");

  main.innerHTML = `
    ${renderDailyCard()}
    <p class="intro-note">Cada simulado sorteia 10 questões do banco daquela matéria. Escolha uma alternativa e confirme quando tiver certeza. Só depois da confirmação o site revela o resultado e a explicação.</p>
    <div class="subject-grid">${rows}</div>
  `;

  main.querySelectorAll("[data-subject]").forEach(button => {
    button.addEventListener("click", () => startQuiz(button.dataset.subject));
  });
}

function renderQuizLike(isDaily){
  const main = document.getElementById("main");
  const q = state.roundQuestions[state.currentIndex];
  if(!q) return;

  const total = state.roundQuestions.length;
  const pct = Math.round(((state.currentIndex + 1) / total) * 100);
  const letters = ["A","B","C","D"];

  let optionsHtml = letters.map(letter => {
    let cls = "option";
    if(state.confirmedAnswer){
      cls += " locked";
      if(letter === q.correct) cls += " correct";
      else if(letter === state.selectedOption) cls += " incorrect";
      else cls += " dim";
    } else if(letter === state.selectedOption){
      cls += " selected";
    }

    return `
      <button type="button" class="${cls}" data-option="${letter}" ${state.confirmedAnswer ? "disabled" : ""}>
        <span class="letter">${letter}</span>
        <span>${esc(q.options[letter])}</span>
      </button>
    `;
  }).join("");

  let explanationHtml = "";
  if(state.confirmedAnswer){
    const isRight = state.selectedOption === q.correct;
    if(isRight){
      explanationHtml = `<div class="explanation right"><span class="head">Por que está certa</span>${esc(q.explanations[q.correct])}</div>`;
    } else {
      explanationHtml = `
        <div class="explanation wrong"><span class="head">Por que a alternativa ${esc(state.selectedOption)} está errada</span>${esc(q.explanations[state.selectedOption])}</div>
        <div class="explanation right" style="margin-top:12px;"><span class="head">Por que a alternativa ${esc(q.correct)} está certa</span>${esc(q.explanations[q.correct])}</div>
      `;
    }
  }

  const isLast = state.currentIndex === total - 1;

  const confirmHtml = state.selectedOption && !state.confirmedAnswer ? `
    <div class="answer-confirm">
      <p>Você marcou <strong>${esc(state.selectedOption)}</strong>. Quer confirmar sua resposta?</p>
      <button type="button" class="primary ${isDaily ? "rose" : ""}" id="confirm-answer">Confirmar resposta &rarr;</button>
    </div>
  ` : "";

  main.innerHTML = `
    <div class="progress-row">
      <span class="progress-label">${state.currentIndex + 1} / ${total}</span>
      <div class="progress-track"><div class="progress-fill ${isDaily ? "rose" : ""}" style="width:${pct}%"></div></div>
      <span class="progress-label">${state.score} acertos</span>
    </div>
    <div class="question-card ${isDaily ? "daily" : ""}">
      <p class="art-label">QUESTÃO ${state.currentIndex + 1}${isDaily ? `<span class="subject-badge">${esc(SUBJECT_LABELS[q.subject] || q.subject)}</span>` : ""}</p>
      <p class="statement">${esc(q.statement)}</p>
    </div>
    <div class="options">${optionsHtml}</div>
    ${confirmHtml}
    ${explanationHtml}
    ${state.confirmedAnswer ? `
      <div class="next-row">
        <button type="button" class="primary ${isDaily ? "rose" : ""}" id="next-question">${isLast ? "Ver resultado final" : "Próxima questão"} &rarr;</button>
      </div>
    ` : ""}
  `;

  main.querySelectorAll("[data-option]").forEach(button => {
    button.addEventListener("click", () => selectOption(button.dataset.option));
  });

  const nextButton = document.getElementById("next-question");
  if(nextButton) nextButton.addEventListener("click", nextQuestion);
}

function renderResult(){
  const main = document.getElementById("main");
  const total = state.roundQuestions.length;
  const pct = total ? Math.round((state.score / total) * 100) : 0;

  let msg;
  if(pct >= 80) msg = "Excelente domínio da matéria — esse desempenho já está no nível de aprovação.";
  else if(pct >= 60) msg = "Bom resultado. Vale revisar os pontos que geraram dúvida e repetir o simulado.";
  else msg = "Ainda dá pra melhorar bastante. Recomendo revisar a matéria e tentar de novo — os erros de agora viram acerto na próxima rodada.";

  main.innerHTML = `
    <div class="result-wrap">
      <p class="result-label">DESEMPENHO NESTA RODADA</p>
      <p class="result-score">${state.score}<span>/${total}</span></p>
      <p class="result-label">${pct}% DE APROVEITAMENTO</p>
      <p class="result-msg">${esc(msg)}</p>
      <div class="result-actions">
        <button type="button" class="primary" id="retry-subject">Refazer este simulado &rarr;</button>
        <button type="button" class="ghost" id="choose-subject">Escolher outra matéria</button>
      </div>
    </div>
  `;

  document.getElementById("retry-subject").addEventListener("click", retrySameSubject);
  document.getElementById("choose-subject").addEventListener("click", goHome);
}

function renderDailyResult(){
  const main = document.getElementById("main");
  const total = state.roundQuestions.length;
  const perfect = state.score === total;

  main.innerHTML = `
    <div class="result-wrap">
      <p class="result-label">DESAFIO DIÁRIO — ${esc(todayStr())}</p>
      <p class="result-score">${state.score}<span>/${total}</span></p>
      ${perfect ? `<div class="cute-message">${esc(state.dailyMessage)}</div>` : `<p class="result-msg">Quase lá! Amanhã tem um novo desafio — bora tentar de novo.</p>`}
      <div class="result-actions">
        <button type="button" class="ghost" id="back-home">Voltar ao início</button>
      </div>
    </div>
  `;

  document.getElementById("back-home").addEventListener("click", goHome);
}

function bindStaticActions(){
  document.querySelectorAll('[data-action="home"]').forEach(el => {
    el.addEventListener("click", goHome);
  });
  document.querySelectorAll('[data-action="retry"]').forEach(el => {
    el.addEventListener("click", loadEverything);
  });
  document.querySelectorAll('[data-action="daily"]').forEach(el => {
    el.addEventListener("click", startDaily);
  });
}

function render(){
  renderHeader();
  if(state.screen === "loading") renderLoading();
  else if(state.screen === "error") renderError();
  else if(state.screen === "home") renderHome();
  else if(state.screen === "quiz") renderQuizLike(false);
  else if(state.screen === "result") renderResult();
  else if(state.screen === "daily-quiz") renderQuizLike(true);
  else if(state.screen === "daily-result") renderDailyResult();
  bindStaticActions();
  window.scrollTo({top: 0, behavior: "instant"});
}

/* Se a sessão expirar, recarrega a identidade antes da próxima operação. */
sb.auth.onAuthStateChange((_event, session) => {
  currentUser = session?.user || null;
});

document.getElementById("main").addEventListener("click", (event) => {
  if(event.target.closest("#confirm-answer")) confirmAnswer();
});

loadEverything();
</script>
